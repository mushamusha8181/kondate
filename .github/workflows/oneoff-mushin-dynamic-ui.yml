name: One-off dynamic MUSHIN UI patch

on:
  push:
    paths:
      - 'MUSHIN_DYNAMIC_UI_TRIGGER'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dynamic UI styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/jp/mushamusha/kyounokondate/MainActivity.kt')
          s=p.read_text()
          anchor='import android.widget.Toast\n'
          if 'import jp.mushamusha.mushinglass.MushinGlass' not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s=s.replace(anchor, anchor+'import jp.mushamusha.mushinglass.MushinGlass\n',1)
          anchor='''        })\n    }\n\n    private fun buildPlayer'''
          if anchor not in s: raise SystemExit('render end anchor missing')
          s=s.replace(anchor,'''        })\n        MushinGlass.applyToView(this, content)\n    }\n\n    private fun buildPlayer''',1)
          anchor='''        box.addView(include)\n        box.addView(exclude)\n        AlertDialog.Builder(this)'''
          if anchor not in s: raise SystemExit('dialog anchor missing')
          s=s.replace(anchor,'''        box.addView(include)\n        box.addView(exclude)\n        MushinGlass.applyToView(this, box)\n        AlertDialog.Builder(this)''',1)
          p.write_text(s)
          PY
          rm -f MUSHIN_DYNAMIC_UI_TRIGGER .github/workflows/oneoff-mushin-dynamic-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply MUSHIN settings to dynamic recipe UI'
          git push
