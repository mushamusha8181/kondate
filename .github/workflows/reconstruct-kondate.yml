# Triggered after ZIP import fix
name: Import kondate source

on:
  push:
    branches: [main]
    paths:
      - 'KyouNoKondate-source-v1.3.0.zip'
      - '.github/workflows/reconstruct-kondate.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "8a9bc1a5b189751914f80640ae63bb03ea59459c7c4189cbdfb7dc55dc695ed5  KyouNoKondate-source-v1.3.0.zip" | sha256sum -c -
          unzip -t KyouNoKondate-source-v1.3.0.zip

      - name: Expand source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          unzip -q KyouNoKondate-source-v1.3.0.zip -d "$tmp"
          test -d "$tmp/KyouNoKondate"
          cp -a "$tmp/KyouNoKondate/." .
          rm -rf "$tmp" .zip-parts

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import 今日の献立 v1.3.0 source"
          git push
