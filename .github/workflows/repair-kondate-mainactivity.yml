name: Repair kondate MainActivity patch

on:
  push:
    paths:
      - '.github/workflows/repair-kondate-mainactivity.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous MainActivity and apply only receiver fix
        run: |
          git show d8b93ada84b313b295c49c7931b49506ea0355ad:app/src/main/java/jp/mushamusha/kyounokondate/MainActivity.kt > app/src/main/java/jp/mushamusha/kyounokondate/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/jp/mushamusha/kyounokondate/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          s=s.replace('setText(filters.includeIngredients)', 'setText(this@MainActivity.filters.includeIngredients)', 1)
          s=s.replace('setText(filters.excludeIngredients)', 'setText(this@MainActivity.filters.excludeIngredients)', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/repair-kondate-mainactivity.yml
      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/jp/mushamusha/kyounokondate/MainActivity.kt .github/workflows/repair-kondate-mainactivity.yml
          git commit -m "Repair ingredient filter receiver without unrelated UI changes"
          git push
